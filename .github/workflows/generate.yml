name: Generate
# Regenerates the committed, generated artefacts on a clean runner and uploads them, so a change
# can be made on a machine too small to build the whole workspace. Run by hand; it never pushes.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openapi:
    name: Regenerate spec/openapi.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @recueil/server run openapi
      - run: git diff --stat -- spec/openapi.yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated
          path: spec/openapi.yaml
          retention-days: 3
