# Release: build the multi-architecture container image for a version tag and push it to GHCR.
#
# The only trigger that does anything is a `v*` tag. `workflow_dispatch` exists so the workflow can
# be inspected and started by hand, but every job is guarded on the tag, so a manual run on a branch
# completes as a no-op rather than publishing something unversioned.
#
# Container publishing is not verified by the local application tests. Complete the
# deployment acceptance in deploy/README.md before authorizing a version tag.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr.io/etabli-dev/recueil is the default. GITHUB_TOKEN can only push to the namespace of the
  # repository's own owner, so if the repository moves, set the `GHCR_IMAGE` repository variable to
  # the new namespace (or supply a token with `write:packages` for the old one).
  IMAGE_NAME: ${{ vars.GHCR_IMAGE || 'ghcr.io/etabli-dev/recueil' }}

jobs:
  image:
    name: Container image
    # The guard. Without a v* tag this job is skipped and the workflow is a no-op.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      # Both are needed by actions/attest-build-provenance.
      id-token: write
      attestations: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Derive the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $IMAGE_NAME version $version from ${GITHUB_SHA}"

      # QEMU is what makes the arm64 half of the manifest buildable on an amd64 runner. It is slow;
      # if release builds become painful, the answer is a native arm64 runner, not dropping arm64:
      # a self-hosted single-user server is as likely to be a Raspberry Pi or an Ampere VPS as an
      # x86 box.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest=auto moves `latest` for a plain semver tag and leaves it alone for a prerelease,
          # so v1.2.0-rc.1 never becomes the tag people pull by default.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=Recueil
            org.opencontainers.image.description=Self-hosted, API-first document and reference manager with reference verification, bibliometrics and systematic-review workflow
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.vendor=etabli

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/Dockerfile
          # deploy/Dockerfile also carries an ocr-worker stage; the published image is the plain
          # runtime, so the target is explicit.
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            RECUEIL_VERSION=${{ steps.version.outputs.version }}
            RECUEIL_REVISION=${{ github.sha }}
          # Attach SLSA provenance and an SBOM to the image itself, so `docker buildx imagetools
          # inspect` and `cosign` can read them without this repository being available.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A second, independent provenance record: signed by GitHub's attestation service and
      # verifiable with `gh attestation verify oci://<image>@<digest>`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A standalone SPDX document as well as the attached one, because the release page and any
      # downstream vulnerability scan want a file, not an attestation.
      - name: Generate the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          artifact-name: recueil-${{ steps.version.outputs.version }}-sbom.spdx.json
          output-file: ${{ runner.temp }}/recueil-sbom.spdx.json
          # The release, if there is one, is created by hand; this workflow only publishes the image.
          upload-release-assets: false

      - name: Summarise
        run: |
          {
            echo "## Recueil ${{ steps.version.outputs.version }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${{ env.IMAGE_NAME }}\` |"
            echo "| Digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo
            echo "Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Platform roadmap PM4: the apps, as unsigned packages on a draft release with checksums and
  # build provenance. Signing (PM5, PM10) needs the owner's certificates and keystore; nothing here
  # asks for them. The draft is published by hand, after the acceptance lists in the roadmap.
  desktop:
    name: Desktop package (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, bundles: 'deb,appimage', glob: 'deb/*.deb appimage/*.AppImage' }
          - { name: Windows, os: windows-latest, bundles: msi, glob: 'msi/*.msi' }
          - { name: macOS, os: macos-15, bundles: dmg, glob: 'dmg/*.dmg' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal --no-self-update
          rustup default 1.93.1
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev libayatana-appindicator3-dev file
      - run: pnpm install --frozen-lockfile --filter "@recueil/desktop..."
      - run: pnpm --filter @recueil/desktop exec tauri build --bundles ${{ matrix.bundles }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Collect the packages
        shell: bash
        run: |
          mkdir -p out
          cd apps/desktop/src-tauri/target/release/bundle
          for pattern in ${{ matrix.glob }}; do cp $pattern "$GITHUB_WORKSPACE/out/"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  android:
    name: Android package (unsigned release APK)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile --filter "@recueil/mobile..."
      - run: pnpm --filter "@recueil/mobile..." run build
      - run: pnpm --filter @recueil/mobile exec cap sync android
      - name: Gradle release build (unsigned)
        working-directory: apps/mobile/android
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/recueil-android-${GITHUB_REF_NAME}-unsigned.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

  connector:
    name: Browser connector (Chromium and Firefox)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile --filter "@recueil/connector..."
      - run: pnpm --filter @recueil/connector test
      - run: pnpm --filter @recueil/connector run build
      - name: Zip each browser's build
        run: |
          mkdir -p out
          for browser in chrome firefox; do (cd apps/connector/dist/$browser && zip -qr "$GITHUB_WORKSPACE/out/recueil-connector-$browser-${GITHUB_REF_NAME}.zip" .); done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-connector
          path: out/*
          if-no-files-found: error

  draft-release:
    name: Draft release with checksums and provenance
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, connector]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Recueil $GITHUB_REF_NAME" \
            --notes "Unsigned packages for testing; see docs/platform-roadmap.md for what has been verified on each platform. Check downloads against SHA256SUMS and the build provenance (gh attestation verify)."
