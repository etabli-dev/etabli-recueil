name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
jobs:
  checks:
    name: Source and contract checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      # The contract this build generates, kept as an artifact: when the committed spec/openapi.yaml
      # is stale, the contract test fails and this is the file to commit.
      - run: node apps/server/dist/bin/write-openapi.js "$RUNNER_TEMP/openapi.yaml"
        if: matrix.node == '22'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '22'
        with:
          name: generated-openapi
          path: ${{ runner.temp }}/openapi.yaml
          retention-days: 3
      - run: pnpm typecheck
      - run: pnpm check:spec
      - run: pnpm test
      # The systematic-review exports, as the TypeScript tests just wrote them (packages/sr), read
      # by the R packages that have to take them unmodified: PRISMA2020, robvis and metafor
      # (CONCEPT §7 Phase 7 exit). The CSVs are produced here and never committed.
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.node == '22'
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        if: matrix.node == '22'
        with:
          working-directory: clients/r
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::metafor
            any::PRISMA2020
            any::robvis
      - name: Systematic-review exports load in PRISMA2020, robvis and metafor
        if: matrix.node == '22'
        run: |
          R CMD INSTALL clients/r
          Rscript -e 'library(testthat); library(recueil); res <- as.data.frame(test_file("clients/r/tests/testthat/test-sr.R", reporter = "summary", stop_on_failure = TRUE)); if (any(res$skipped)) stop("a review export test was skipped: its fixture was not written")'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.node == '22'
        with:
          name: r-fixtures
          path: clients/r/tests/testthat/fixtures/
          retention-days: 3
      - run: pnpm audit --audit-level high
  browser:
    name: Built client against real API and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @recueil/web exec playwright install --with-deps chromium
      - run: pnpm --filter @recueil/web test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
  container:
    name: Container build and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build runtime and verify isolated recovery
        run: bash deploy/smoke.sh --run --output "$RUNNER_TEMP/recueil-container-smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-smoke
          path: ${{ runner.temp }}/recueil-container-smoke/
          if-no-files-found: warn
  ci:
    name: CI complete
    runs-on: ubuntu-latest
    if: always()
    needs: [checks, browser, container]
    steps:
      - name: Require every gate
        env:
          CHECKS: ${{ needs.checks.result }}
          BROWSER: ${{ needs.browser.result }}
          CONTAINER: ${{ needs.container.result }}
        run: test "$CHECKS" = success && test "$BROWSER" = success && test "$CONTAINER" = success
