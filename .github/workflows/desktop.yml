# Desktop: build and package the Tauri shell in apps/desktop for Linux, Windows and macOS.
#
# Each leg builds the web client and its workspace dependencies, assembles the shell's frontend
# (`tauri build` runs that as its beforeBuildCommand), packages the formats that platform ships
# and uploads them as workflow artifacts. Nothing here is signed or published: Developer ID
# signing and notarisation, Windows code signing and GitHub Releases are milestones in
# docs/platform-roadmap.md, and they need secrets this workflow deliberately does not ask for.
#
# The path filter keeps a documentation-only change from costing three desktop builds.

name: Desktop
on:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - apps/web/**
      - packages/rules/**
      - packages/schemas/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  pull_request:
    branches: [main]
    paths:
      - apps/desktop/**
      - apps/web/**
      - packages/rules/**
      - packages/schemas/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI: 'true'
  # The toolchain the Linux package was verified with locally. Tauri 2.12 needs 1.90 or newer.
  RUST_TOOLCHAIN: '1.93.1'
  # The AppImage tooling is itself shipped as AppImages; extracting them instead of mounting them
  # means the runner does not need FUSE 2. Ignored everywhere else.
  APPIMAGE_EXTRACT_AND_RUN: '1'
jobs:
  package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            bundles: deb,appimage
            artifact: recueil-desktop-linux-x86_64
            path: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            bundles: msi
            artifact: recueil-desktop-windows-x86_64
            path: apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          - name: macOS
            os: macos-15
            bundles: dmg
            artifact: recueil-desktop-macos-arm64
            path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@9.15.4
      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update
          rustup default "$RUST_TOOLCHAIN"
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev file
      # The shell and what it is built from (the web client, rules and schemas), not the whole
      # workspace. The server side brings native modules the shell never loads, and building them
      # here is what fails: when better-sqlite3 has no binary to fetch it falls back to node-gyp,
      # and the node-gyp bundled with pnpm 9 cannot find the Visual Studio on windows-latest.
      - run: pnpm install --frozen-lockfile --filter "@recueil/desktop..."
      - name: Shell unit tests
        run: pnpm --filter @recueil/desktop test
      - name: Build and package
        run: pnpm --filter @recueil/desktop exec tauri build --bundles ${{ matrix.bundles }}
      # After the build, because `tauri::generate_context!` embeds the assembled frontend and so
      # needs apps/desktop/dist to exist before the crate compiles.
      - name: Rust unit tests
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Inspect the Debian package
        if: runner.os == 'Linux'
        run: |
          for deb in apps/desktop/src-tauri/target/release/bundle/deb/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
