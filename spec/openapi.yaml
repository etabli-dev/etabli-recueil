          name: itemType
          schema:
            description: Exact match on the item type slug.
            type: string
            maxLength: 64
          description: Exact match on the item type slug.
        - in: query
          name: collectionId
          schema:
            description: Only items filed in this collection.
            $ref: '#/components/schemas/Id'
          description: Only items filed in this collection.
        - in: query
          name: tagId
