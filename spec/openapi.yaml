            minLength: 1
            maxLength: 2048
            description: The query. Bare words are `AND`; `"a phrase"`; `term*`; `-excluded`; `OR`;
              `(grouping)`; `field:term` over `title`, `creator`, `container`, `id`, `tag`, `note`,
              `text`.
            examples:
              - title:trial AND -retracted
              - '"randomised controlled" creator:ravaud'
          required: true
          description: The query. Bare words are `AND`; `"a phrase"`; `term*`; `-excluded`; `OR`;
