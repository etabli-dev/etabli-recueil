          minLength: 1
          maxLength: 1024
          description: Rendered once, on write.
        sortName:
          type: string
          minLength: 1
          maxLength: 1024
          description: '`family, given` normalised — the dedup blocking key.'
        disambiguationStatus:
          $ref: '#/components/schemas/DisambiguationStatus'
        mergedIntoCreatorId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        trashedAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/CreatorKind'
        familyName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        givenName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        namePrefix:
          description: '`van`, `de`, where the source separates it.'
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
        nameSuffix:
          description: '`Jr`, `III`.'
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
        literalName:
          description: Single-field name. Required for an organisation and for persons whose name does not
