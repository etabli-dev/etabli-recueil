        title:
          description: Defaults to the document filename.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
      required:
        - documentId
      additionalProperties: false
      title: AttachDocument
    ItemCreatorWrite:
      type: object
      properties:
        creators:
          maxItems: 10000
          type: array
          items:
            type: object
            properties:
              creatorId:
                $ref: '#/components/schemas/Id'
              role:
                type: string
                enum:
                  - author
                  - editor
                  - translator
                  - contributor
                  - series_editor
                  - recipient
                  - interviewer
                  - director
                  - reviewed_author
                  - sender
                  - correspondent
              rawName:
                anyOf:
                  - type: string
                    minLength: 1
                    maxLength: 1024
                  - type: 'null'
              affiliationRaw:
                anyOf:
                  - type: string
                    minLength: 1
                    maxLength: 1024
                  - type: 'null'
              affiliationRor:
                anyOf:
                  - type: string
                    maxLength: 16
                  - type: 'null'
              affiliationCreatorId:
                anyOf:
                  - $ref: '#/components/schemas/Id'
                  - type: 'null'
              countryCode:
                anyOf:
                  - type: string
                    minLength: 2
                    maxLength: 2
                  - type: 'null'
              isCorresponding:
                type: boolean
              contributionRoles:
                anyOf:
                  - maxItems: 32
                    type: array
                    items:
                      type: string
                      maxLength: 64
                  - type: 'null'
            required:
              - creatorId
            additionalProperties: false
          description: The whole author list, in order. The server assigns the dense ordinal block in one
            transaction, so a client never computes positions (IC1).
      required:
        - creators
      additionalProperties: false
      title: ItemCreatorWrite
    ItemTagWrite:
      type: object
      properties:
        tagNames:
          maxItems: 1000
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 1024
          description: The complete tag set for this item, by name. Unknown names are created.
        source:
          description: Why the tags are being applied. Defaults to `manual` (P4).
          type: string
          enum:
            - manual
            - rule
            - resolver
            - import
            - plugin
            - merge
      required:
        - tagNames
      additionalProperties: false
      title: ItemTagWrite
    DocumentUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: The file. Required.
        itemId:
          type: string
        role:
          type: string
        sourceKind:
          type: string
        sourceRef:
          type: string
        title:
          type: string
      required:
        - file
      title: DocumentUpload
    AttachmentOrder:
      type: object
      properties:
        attachmentIds:
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: The ids in the order wanted. Any live attachment left out keeps its relative order
