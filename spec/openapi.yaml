          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        initials:
          description: bibliometrix AU uses the abbreviated form.
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        nameVariants:
          maxItems: 256
          type: array
          items:
            $ref: '#/components/schemas/NameVariant'
        orcid:
          anyOf:
            - $ref: '#/components/schemas/Orcid'
            - type: 'null'
        openalexAuthorId:
          anyOf:
            - type: string
              pattern: ^A\d{2,12}$
            - type: 'null'
        semanticScholarAuthorId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        scopusAuthorId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        researcherId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        isni:
          anyOf:
            - type: string
              pattern: ^\d{15}[\dX]$
            - type: 'null'
        viaf:
          anyOf:
            - type: string
              pattern: ^\d{1,22}$
            - type: 'null'
        ror:
          description: Organisations only.
          anyOf:
            - $ref: '#/components/schemas/Ror'
            - type: 'null'
        wikidataId:
          anyOf:
            - type: string
              pattern: ^Q\d+$
            - type: 'null'
      required:
        - id
        - displayName
        - sortName
        - disambiguationStatus
        - createdAt
        - updatedAt
        - kind
      additionalProperties: false
      title: Creator
      description: 'A person or organisation. Two creators with different non-null ORCIDs are never merged
        automatically: the `author_consistency` check flags the conflict instead (CR2, P3).'
    CreatorCreate:
      type: object
      properties:
        kind:
