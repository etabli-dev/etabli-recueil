            - import
            - connector
            - merge
            - plugin
      required:
        - itemIds
      additionalProperties: false
      title: CollectionMembershipChange
    MergeRequest:
      type: object
      properties:
        loserId:
          description: The record that loses. It goes to the trash, reversibly (P5).
