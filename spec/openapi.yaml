components:
  schemas:
    ItemBulkRequest:
      type: object
      properties:
        idempotencyKey:
          description: May be sent here instead of in the header. The header wins if both are present.
          $ref: '#/components/schemas/IdempotencyKey'
        force:
          description: Re-run work whose idempotency key already exists, by appending a run counter to the
            key. Nothing is ever silently duplicated and nothing silently skipped (IK3).
          type: boolean
        atomic:
          description: 'When true the whole batch is one transaction: any rejection rolls all of it back.'
          type: boolean
        operations:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/ItemBulkOperation'
      required:
        - operations
      additionalProperties: false
      title: ItemBulkRequest
    ItemBulkOperation:
      type: object
      properties:
        op:
          $ref: '#/components/schemas/BulkOperationVerb'
        id:
          description: Required for update, replace, delete and restore.
          $ref: '#/components/schemas/Id'
        payload:
          anyOf:
            - $ref: '#/components/schemas/ItemCreate'
            - $ref: '#/components/schemas/ItemUpdate'
        ref:
          description: Client-chosen label echoed in the result, so a queue can reconcile without relying on
            order.
          type: string
          maxLength: 64
      required:
        - op
      additionalProperties: false
      title: ItemBulkOperation
    BibliographicWriteRequest:
      type: object
      properties:
        values:
          unusedIO: input
          description: The fields to write. Partial.
          $ref: '#/components/schemas/BibliographicFacetUpdate'
        provenance:
          $ref: '#/components/schemas/ProvenanceStamp'
      required:
        - values
      additionalProperties: false
      title: BibliographicWriteRequest
    ProvenanceStamp:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/ProvenanceSource'
