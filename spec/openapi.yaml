    get:
      operationId: exportSelection
      summary: Export a selection
      description: >-
        BibTeX, BibLaTeX, RIS or CSL-JSON over a collection, a saved search or an explicit list of
        ids. Exactly one selection must be given: exporting the whole library by accident is not
        something an endpoint should make easy.


        Citation keys follow ADR-0016: a stored key always wins, a pinned key is never recomputed,
        and only keyless items get a generated key — disambiguated against the keys already in the
        batch, so a new item can never take one a manuscript points at.


        `report=true` returns what the format could not carry instead of the file (P10).


        **Scope:** `export:read`.
      tags:
        - Platform
      parameters:
        - in: path
          name: format
          schema:
            $ref: '#/components/schemas/ExportFormat'
          required: true
          description: The serialisation formats of CONCEPT.md §5.11.
        - in: query
          name: collectionId
          schema:
            description: Export a collection, or a saved search.
            $ref: '#/components/schemas/Id'
          description: Export a collection, or a saved search.
        - in: query
          name: ids
          schema:
            description: A comma-separated list of item ids. Order is preserved.
            type: string
            maxLength: 65536
          description: A comma-separated list of item ids. Order is preserved.
        - in: query
          name: q
          schema:
            description: A full-text query in Recueil's syntax.
            type: string
            maxLength: 2048
          description: A full-text query in Recueil's syntax.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 10000
        - in: query
          name: report
          schema:
            description: Return the loss report as JSON instead of the file. What a format cannot carry is
