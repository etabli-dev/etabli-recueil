openapi: 3.1.0
info:
  title: Recueil API
  version: 0.0.0
  summary: Self-hosted document and reference management, API-first.
  description: >-
    The REST contract of a Recueil server. Nothing in Recueil is UI-only (P6): the web UI, the CLI,
    the MCP server and the R and Python packages are all clients of these endpoints, with no
    privileged back channel.


    This document is generated from the Zod schemas in `@recueil/schemas`, which are the same
    schemas the server validates requests with, so the two cannot drift.


    Phase 0 declares the schemas and the `/health` operation; the resource paths arrive with the
    features that serve them, from Phase 1 onwards (CONCEPT.md §7).
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: Recueil
    url: https://github.com/etabli/recueil
externalDocs:
  description: Concept, data model and ADRs
  url: https://github.com/etabli/recueil/tree/main/spec
servers:
  - url: http://localhost:3000
    description: Local server, or the Tauri sidecar in local mode
  - url: https://recueil.example.org
    description: A self-hosted deployment behind a reverse proxy
tags:
  - name: System
    description: Health, version and administrative endpoints.
  - name: Library
    description: Items, documents, attachments, collections, tags, notes, annotations, creators.
  - name: Search
    description: Boolean and per-field queries, facets, saved searches.
  - name: Quality
    description: The verification engine and both deduplication layers.
  - name: Ingestion
    description: Sources, the pipeline and the review queue.
  - name: Graph
    description: Citation and derived networks, shadow works, budgeted expansion.
  - name: Analytics
    description: The Parquet bundle for R, Python and DuckDB.
  - name: Systematic review
    description: The PRISMA workflow.
  - name: Platform
    description: Plugins, jobs, export.
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Service health
      description: >-
        Reports whether the server is serving, which components are up, where the file store is and
        how large the library is. Unauthenticated, unversioned and cheap: a container health check
        runs it every thirty seconds.


        Every number is measured on the way past, so `library` being all zeroes means an empty
        library and not an unimplemented endpoint — which is the Phase 0 exit criterion (CONCEPT.md
        §7).
      tags:
        - System
      security: []
      responses:
        '200':
          description: The server is serving. `status` may still be `degraded` when an optional component is
            down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerHealthResponse'
        '503':
          description: A required component is down. The body is the same health document, so a probe that
            gets a 503 still learns which component failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerHealthResponse'
  /api/v1/system/info:
    get:
      operationId: getSystemInfo
      summary: Server identity and capabilities
      description: 'Release, API version, runtime and the location of the contract document. Static: for
        liveness use `GET /health`.'
      tags:
        - System
      security: []
      responses:
        '200':
          description: What this server is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '500':
          description: Something went wrong.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: The OpenAPI 3.1 contract
      description: The document generated from the Zod schemas this server validates with, including the
        operations this server adds to the shared contract. Unauthenticated, because a client that
        cannot read the contract cannot work out how to authenticate.
      tags:
        - System
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
