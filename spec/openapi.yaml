          anyOf:
            - type: string
              maxLength: 512
            - type: 'null'
        sourceVersion:
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
        confidence:
          anyOf:
            - $ref: '#/components/schemas/Confidence'
            - type: 'null'
        fetchedAt:
          $ref: '#/components/schemas/Timestamp'
        locked:
          description: Override the default, which is "manual writes lock and automated writes do not" (P4-1).
          type: boolean
      required:
        - source
      additionalProperties: false
      title: ProvenanceStamp
      description: The source a facet write is attributed to. Omit it and the write is `manual` and locks
        (P4-1).
    OfficeWriteRequest:
      type: object
      properties:
        values:
          $ref: '#/components/schemas/OfficeFacetUpdate'
        provenance:
          $ref: '#/components/schemas/ProvenanceStamp'
      required:
        - values
      additionalProperties: false
      title: OfficeWriteRequest
    FieldLockRequest:
      type: object
      properties:
        facet:
          description: Defaults to `bibliographic`.
          type: string
          enum:
            - bibliographic
            - office
        fieldPath:
          $ref: '#/components/schemas/FieldPath'
      required:
        - fieldPath
      additionalProperties: false
      title: FieldLockRequest
    TrashRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
            - user
            - merge
            - import_rollback
            - cascade
            - plugin
        reasonDetail:
          type: string
          maxLength: 1024
      additionalProperties: false
      title: TrashRequest
    AttachDocument:
      type: object
      properties:
        documentId:
          $ref: '#/components/schemas/Id'
