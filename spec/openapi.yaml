    get:
      operationId: search
      summary: Full-text search
      description: >-
        Ranked results across items, notes and extracted document text, each with a snippet. A title
        match beats a body match beats a match in the extracted text of a fifty-page PDF, which is
        what a reader means by relevance in a reference library.


        For a *filter* that can be paged and combined with a collection or a tag, use `GET
        /api/v1/items?q=…` instead.


