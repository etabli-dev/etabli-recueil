        required: true
        description: An operation whose payload is not valid fails that operation, not the batch.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemBulkRequest'
      responses:
        '200':
          description: The stored result of an earlier identical call (IK2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '207':
          description: The per-operation outcome of this batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResult'
        '401':
