        createdAt:
          $ref: '#/components/schemas/Timestamp'
        creatorId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/CreatorRole'
        rawName:
          description: Exactly as printed, kept for BibTeX fidelity and the `author_consistency` check.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        affiliationRaw:
          description: The affiliation as printed — bibliometrix C1.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        affiliationRor:
          anyOf:
            - $ref: '#/components/schemas/Ror'
            - type: 'null'
        affiliationCreatorId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        countryCode:
          anyOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
        isCorresponding:
          type: boolean
        contributionRoles:
          description: CRediT taxonomy roles, when the source supplies them.
