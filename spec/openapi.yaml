  /api/v1/storage/backends/{id}/health:
    post:
      operationId: checkStorageBackend
      summary: Probe a storage backend
      description: >-
        `read` (the default) asks the store for the digest of some random bytes: a complete round
        trip through authentication and addressing that writes nothing, and whose correct answer is
        "absent".


        `roundtrip` additionally writes a 64-byte probe blob, reads it back through the store's own
        reader, compares the digest of what came back with the digest of what went in, and deletes
        it in a `finally`. It is the only mode that proves the store can hold a document and the
        only one that catches a server that accepts a `PUT` and stores something else.


        `status` is the conjunction of the individual checks; `degraded` is reserved for the case
        where the store worked and the probe blob could not be removed.


        **Scope:** `storage:write`.
      tags:
        - Storage
      parameters:
        - in: path
          name: id
          schema:
            description: The record id (a ULID).
            $ref: '#/components/schemas/Id'
          required: true
          description: The record id (a ULID).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageHealthRequest'
      responses:
