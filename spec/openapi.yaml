      required:
        - parentId
      additionalProperties: false
      title: CollectionMove
    CollectionMembershipChange:
      type: object
      properties:
        itemIds:
          minItems: 1
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/Id'
        source:
          description: Why the items are being filed. Defaults to `manual` (P4).
          type: string
          enum:
            - manual
