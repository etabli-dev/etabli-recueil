    get:
      operationId: streamEvents
      summary: Lifecycle event stream
      description: >-
        A Server-Sent Events stream of the lifecycle events of `spec/hooks.md` §7. Each frame
        carries the event type in its `event:` field and the envelope as JSON in `data:`, with the
        monotonic `sequence` as the SSE id.


        The twelve types are declared in the catalogue; this Phase 1 surface can cause
        `item.created`, `item.updated`, `item.trashed`, `item.restored`, `document.ingested`,
        `attachment.added`, `job.started`, `job.finished`, `job.failed`. The others (`item.merged`,
        `annotation.created`, `check.completed`) arrive with the phases that implement them.


        There is no replay: a subscriber receives events from the moment it subscribes (§7.2). Order
        by `sequence`, never by `occurredAt`, which has clock resolution and can tie.


        **Scope:** `events:read`.
      tags:
        - Platform
      parameters:
        - in: query
          name: types
          schema:
            description: Comma-separated lifecycle event types to receive. Everything, when omitted.
            examples:
              - item.created,item.updated
            type: string
            maxLength: 512
          description: Comma-separated lifecycle event types to receive. Everything, when omitted.
        - in: header
          name: last-event-id
          schema:
            description: Accepted and acknowledged; there is no history to replay in v1 (§7.2).
            type: string
          description: Accepted and acknowledged; there is no history to replay in v1 (§7.2).
      responses:
        '200':
          description: The stream. It stays open until the client closes it or the server shuts down.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/LifecycleEvent'
