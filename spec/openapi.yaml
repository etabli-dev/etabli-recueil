      properties:
        role:
          $ref: '#/components/schemas/AttachmentRole'
        title:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        url:
          anyOf:
            - $ref: '#/components/schemas/Url'
            - type: 'null'
        linkedPath:
          anyOf:
            - type: string
              maxLength: 4096
            - type: 'null'
        contentTypeHint:
          anyOf:
            - $ref: '#/components/schemas/MimeType'
            - type: 'null'
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      additionalProperties: false
      title: AttachmentUpdate
    CollectionMembership:
      type: object
      properties:
        collectionId:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        addedAt:
          $ref: '#/components/schemas/Timestamp'
        addedByUserId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        source:
          type: string
          maxLength: 32
      required:
        - collectionId
        - itemId
        - position
        - addedAt
        - source
      additionalProperties: false
      title: CollectionMembership
    FieldValueCreate:
      type: object
      properties:
        fieldId:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        reviewId:
          description: Null means library data; set means extraction data for that review, so the same item
            can hold different values of the same field in two reviews without collision (FV2).
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        extractionFormId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        groupKey:
          description: 'The repeatable group instance: `arm:intervention`, `outcome:mortality_30d`.'
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
        ordinal:
          description: Position within a repeatable field. Requires `isRepeatable` (FV3).
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content:
          anyOf:
            - $ref: '#/components/schemas/FieldValueContent'
            - type: 'null'
        isBlank:
          description: An explicit "not reported", which is a different fact from "not yet extracted" — the
            latter is the absence of the row entirely.
          type: boolean
      required:
        - fieldId
        - itemId
      additionalProperties: false
      title: FieldValueCreate
    FieldValueUpdate:
      type: object
      properties:
        content:
          anyOf:
            - $ref: '#/components/schemas/FieldValueContent'
            - type: 'null'
        isBlank:
          type: boolean
      additionalProperties: false
      title: FieldValueUpdate
    AnnotationCreate:
      type: object
      properties:
        documentId:
          description: The W3C target source. The annotation belongs to the bytes (ADR-0009).
          $ref: '#/components/schemas/Id'
        itemId:
          description: Reading context. A live attachment must exist for (itemId, documentId) (AN2).
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        attachmentId:
          description: The route by which the document was read.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        annotationType:
          $ref: '#/components/schemas/AnnotationType'
        motivation:
          $ref: '#/components/schemas/AnnotationMotivation'
        selector:
          $ref: '#/components/schemas/AnnotationSelectorSet'
        bodyText:
          description: The comment attached to the annotation.
          anyOf:
            - type: string
              maxLength: 1000000
            - type: 'null'
        bodyFormat:
          description: Defaults to `markdown`.
          $ref: '#/components/schemas/AnnotationBodyFormat'
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        pageIndex:
          description: Zero-based physical page.
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: 'null'
        pageLabel:
          description: The printed page label, which is frequently not the physical index.
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        authorName:
          description: For annotations imported from someone else.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        isExternal:
          type: boolean
        externalRef:
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
      required:
        - documentId
        - annotationType
        - motivation
        - selector
      additionalProperties: false
      title: AnnotationCreate
    AnnotationUpdate:
      type: object
      properties:
        annotationType:
          $ref: '#/components/schemas/AnnotationType'
        motivation:
          $ref: '#/components/schemas/AnnotationMotivation'
        selector:
          $ref: '#/components/schemas/AnnotationSelectorSet'
        bodyText:
          anyOf:
            - type: string
              maxLength: 1000000
            - type: 'null'
        bodyFormat:
          $ref: '#/components/schemas/AnnotationBodyFormat'
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        pageLabel:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
      additionalProperties: false
      title: AnnotationUpdate
    WebAnnotation:
      type: object
      properties:
        '@context':
          type: string
          const: http://www.w3.org/ns/anno.jsonld
        id:
          description: An absolute IRI for the annotation, e.g. the API URL of the record.
          $ref: '#/components/schemas/Url'
        type:
          type: string
          const: Annotation
        motivation:
          $ref: '#/components/schemas/AnnotationMotivation'
        created:
          $ref: '#/components/schemas/Timestamp'
        modified:
          $ref: '#/components/schemas/Timestamp'
        creator:
          type: object
          properties:
            id:
              type: string
              maxLength: 512
            type:
              type: string
              enum:
                - Person
                - Organization
                - Software
            name:
              type: string
              minLength: 1
              maxLength: 1024
          additionalProperties: false
        body:
          maxItems: 16
          type: array
          items:
            $ref: '#/components/schemas/TextualBody'
        target:
          type: object
          properties:
            source:
              type: string
              maxLength: 512
              description: The document IRI — `recueil:document/<id>` or an absolute URL.
            selector:
              $ref: '#/components/schemas/AnnotationSelectorSet'
            styleClass:
              type: string
              maxLength: 64
          required:
            - source
            - selector
          additionalProperties: false
        stylesheet:
          type: object
          properties:
            type:
              type: string
              const: CssStylesheet
            value:
              type: string
              maxLength: 4096
          required:
            - type
            - value
          additionalProperties: false
      required:
        - '@context'
        - id
        - type
        - motivation
        - created
        - target
      additionalProperties: false
      title: WebAnnotation
      description: The W3C Web Annotation JSON-LD projection of an annotation record (ADR-0009).
    PageParams:
      type: object
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        limit:
          description: Page size, 1 to 200. Defaults to 25.
          type: integer
          minimum: 1
          maximum: 200
        order:
          $ref: '#/components/schemas/SortDirection'
        sort:
          description: Sort field. The set of accepted fields is per endpoint.
          type: string
          maxLength: 64
      additionalProperties: false
      title: PageParams
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        name:
          type: string
          const: recueil
        version:
          type: string
          maxLength: 64
          description: The server version.
          examples:
            - 0.1.0
        apiVersion:
          type: string
          maxLength: 16
          description: The REST API major version this server serves.
          examples:
            - v1
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        uptimeSeconds:
          type: number
          minimum: 0
        mode:
          type: string
          enum:
            - server
            - sidecar
          description: Docker and local mode run identical code; the shell differs (CONCEPT.md §5.1).
        components:
          maxItems: 64
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
        library:
          $ref: '#/components/schemas/LibrarySummary'
      required:
        - status
        - name
        - version
        - apiVersion
        - checkedAt
        - startedAt
        - uptimeSeconds
        - mode
        - components
      additionalProperties: false
      title: HealthResponse
      description: 'The response of `GET /health`. Unauthenticated, cheap, and safe to poll: measurements
        that cost anything are cached and reported with the time they were taken.'
    DocumentPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - data
        - page
      additionalProperties: false
      title: DocumentPage
    AnnotationPage:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Annotation'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - data
        - page
      additionalProperties: false
      title: AnnotationPage
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A scoped API token. Scopes are resource-and-verb pairs (`items:read`, `sr:write`,
        `admin:*`), and every mutation is attributed in the audit log to the token that made it.
    sessionCookie:
      type: apiKey
      in: cookie
      name: recueil_session
      description: Session authentication for the web UI. Programmatic clients use a bearer token.
