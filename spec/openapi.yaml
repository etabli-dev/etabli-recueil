        - in: path
          name: id
          schema:
            $ref: '#/components/schemas/Id'
          required: true
          description: A 26-character Crockford base32 ULID. Generated by the application, never by the
            database, and lexicographically sortable, so ordering by id is creation order.
        - in: path
          name: fieldKey
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z][a-z0-9_]*$
          required: true
