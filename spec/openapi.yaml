          description: Required for `linked_url`; the capture URL for a snapshot.
          anyOf:
            - $ref: '#/components/schemas/Url'
            - type: 'null'
        linkedPath:
          description: Required for `linked_file`; absolute path on the machine that owns the link.
          anyOf:
            - type: string
              maxLength: 4096
            - type: 'null'
        contentTypeHint:
          description: Declared MIME for linked attachments, where nothing can be sniffed.
          anyOf:
            - $ref: '#/components/schemas/MimeType'
            - type: 'null'
      required:
        - id
        - hasAnnotations
        - annotationCount
        - position
        - source
        - addedAt
        - updatedAt
        - itemId
        - role
        - linkMode
      additionalProperties: false
      title: Attachment
      description: One file in one role for one item. Detaching soft-deletes this row only; the document
        survives, because storage reclamation is a separate, explicit operation (AT2).
    Collection:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          description: Used in `.bib` feed URLs.
          $ref: '#/components/schemas/PublicId'
        nameNormalised:
          type: string
          minLength: 1
          maxLength: 1024
        ownerUserId:
          $ref: '#/components/schemas/Id'
        depth:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Root is 0. Denormalised, rewritten for the whole subtree on move (C4).
        itemCount:
          description: Live members, when the caller asked for counts.
          type: integer
          minimum: 0
          maximum: 9007199254740991
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        trashedAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 1024
        parentId:
          description: Null for a root. The hierarchy is a forest (C1).
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        kind:
          $ref: '#/components/schemas/CollectionKind'
        query:
          description: 'Required when `kind` is `smart`: the saved search in the structured query form.'
          anyOf:
            - $ref: '#/components/schemas/JsonObject'
            - type: 'null'
        queryBackend:
          description: Recorded so a saved search built against one index is not reinterpreted by another
            (ADR-0011).
          anyOf:
            - $ref: '#/components/schemas/QueryBackend'
            - type: 'null'
        description:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - publicId
        - nameNormalised
        - ownerUserId
        - depth
        - createdAt
        - updatedAt
        - name
        - kind
        - position
      additionalProperties: false
      title: Collection
      description: A node in the filing hierarchy, or a saved search. Trashing a collection trashes its
        descendants but never its items (C3).
    Tag:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nameNormalised:
          type: string
          minLength: 1
          maxLength: 1024
          description: NFKC, casefolded, whitespace-collapsed. The uniqueness key, maintained by the
            application.
        ownerUserId:
          $ref: '#/components/schemas/Id'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        trashedAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: As typed.
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        scheme:
          $ref: '#/components/schemas/TagScheme'
        termId:
          description: Optional controlled-vocabulary binding.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - nameNormalised
        - ownerUserId
        - createdAt
        - updatedAt
        - name
        - scheme
        - position
      additionalProperties: false
      title: Tag
      description: 'A free-text label. Renaming a tag is an update, not a create-and-remap: assignments
        follow (TG1).'
    ItemTag:
      type: object
      properties:
        tagId:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 1024
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        source:
          $ref: '#/components/schemas/AssignmentSource'
        ruleRef:
          description: The ingestion rule that applied it (CONCEPT.md §5.3 stage 8).
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
        confidence:
          anyOf:
            - $ref: '#/components/schemas/Confidence'
            - type: 'null'
        addedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - tagId
        - name
        - source
        - addedAt
      additionalProperties: false
      title: ItemTag
    CustomField:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        pluginId:
          description: Set when a plugin declared the field.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        fieldKey:
          $ref: '#/components/schemas/FieldKey'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Display label.
        description:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        dataType:
          $ref: '#/components/schemas/CustomFieldDataType'
        config:
          $ref: '#/components/schemas/JsonObject'
        appliesToItemTypes:
          description: Null means "any item type".
          anyOf:
            - maxItems: 128
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^[a-z][a-z0-9_]*$
            - type: 'null'
        isRequired:
          type: boolean
        isRepeatable:
          type: boolean
        scope:
          $ref: '#/components/schemas/CustomFieldScope'
        position:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - createdAt
        - updatedAt
        - fieldKey
        - name
        - dataType
        - config
        - isRequired
        - isRepeatable
        - scope
        - position
      additionalProperties: false
      title: CustomField
      description: 'A user- or plugin-defined typed field. The data type is immutable once any value
        exists: changing it is a create-plus-migrate operation, never an in-place alteration (CF1).'
    FieldKey:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]*$
      title: FieldKey
      description: Stable slug, used in the API, in exports and as the Parquet column name.
      examples:
        - sample_size
    FieldValueContent:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              const: text
            value:
              type: string
              maxLength: 4096
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: long_text
            value:
              type: string
              maxLength: 1000000
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: number
            value:
              type: number
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: integer
            value:
              type: integer
              minimum: -9007199254740991
              maximum: 9007199254740991
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: boolean
            value:
              type: boolean
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: date
            value:
              $ref: '#/components/schemas/CalendarDate'
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: datetime
            value:
              $ref: '#/components/schemas/Timestamp'
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: choice
            value:
              type: string
              maxLength: 255
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: multi_choice
            value:
              maxItems: 256
              type: array
              items:
                type: string
                maxLength: 255
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: json
            value:
              $ref: '#/components/schemas/JsonValue'
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: item_reference
            value:
              $ref: '#/components/schemas/Id'
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: url
            value:
              $ref: '#/components/schemas/Url'
          required:
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: monetary
            value:
              type: number
              description: Major units. `config.currency` names the unit.
            currency:
              $ref: '#/components/schemas/CurrencyCode'
          required:
            - type
            - value
          additionalProperties: false
      title: FieldValueContent
      description: A custom-field value, discriminated by the data type of its field.
      type: object
    FieldValue:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fieldKey:
          description: The field slug, echoed so a reader needs no second lookup.
          $ref: '#/components/schemas/FieldKey'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        createdByUserId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        fieldId:
          $ref: '#/components/schemas/Id'
        itemId:
          $ref: '#/components/schemas/Id'
        reviewId:
          description: Null means library data; set means extraction data for that review, so the same item
            can hold different values of the same field in two reviews without collision (FV2).
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        extractionFormId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        groupKey:
          description: 'The repeatable group instance: `arm:intervention`, `outcome:mortality_30d`.'
          anyOf:
            - type: string
              maxLength: 128
            - type: 'null'
        ordinal:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        content:
          anyOf:
            - $ref: '#/components/schemas/FieldValueContent'
            - type: 'null'
        isBlank:
          type: boolean
      required:
        - id
        - createdAt
        - updatedAt
        - fieldId
        - itemId
        - ordinal
        - isBlank
      additionalProperties: false
      title: FieldValue
      description: One value of one custom field on one item.
    Note:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          $ref: '#/components/schemas/PublicId'
        ownerUserId:
          $ref: '#/components/schemas/Id'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        trashedAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        itemId:
          description: Null for a standalone note.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        parentAnnotationId:
          description: A note written from a highlight keeps the link.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        title:
          description: Derived from the first heading or line, and stored, so lists need no parsing.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        contentMarkdown:
          type: string
          maxLength: 1000000
          description: The canonical content.
        sourceFormat:
          $ref: '#/components/schemas/NoteSourceFormat'
        contentOriginal:
          description: The imported HTML when `sourceFormat` is `html`, kept verbatim (P10).
          anyOf:
            - type: string
              maxLength: 1000000
            - type: 'null'
        noteKind:
          $ref: '#/components/schemas/NoteKind'
      required:
        - id
        - publicId
        - ownerUserId
        - version
        - createdAt
        - updatedAt
        - contentMarkdown
        - sourceFormat
        - noteKind
      additionalProperties: false
      title: Note
      description: A markdown note, attached to an item or standalone.
    TextQuoteSelector:
      type: object
      properties:
        type:
          type: string
          const: TextQuoteSelector
        exact:
          type: string
          maxLength: 1000000
        prefix:
          type: string
          maxLength: 4096
        suffix:
          type: string
          maxLength: 4096
      required:
        - type
        - exact
      additionalProperties: false
      title: TextQuoteSelector
      description: 'W3C text quote selector: the quoted text with enough context to relocate it.'
    TextPositionSelector:
      type: object
      properties:
        type:
          type: string
          const: TextPositionSelector
        start:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        end:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - type
        - start
        - end
      additionalProperties: false
      title: TextPositionSelector
      description: W3C text position selector, over the extracted text layer.
    FragmentSelector:
      type: object
      properties:
        type:
          type: string
          const: FragmentSelector
        conformsTo:
          description: The fragment specification, e.g. `http://tools.ietf.org/rfc/rfc3778` for PDF.
          type: string
          maxLength: 255
        value:
          type: string
          maxLength: 255
          description: The fragment itself, e.g. `page=7`.
          examples:
            - page=7
      required:
        - type
        - value
      additionalProperties: false
      title: FragmentSelector
      description: W3C fragment selector. For PDFs this carries the page, and it resolves without any text
        layer.
    RectangleSelector:
      type: object
      properties:
        type:
          type: string
          const: RectangleSelector
        pageIndex:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Zero-based physical page.
        rectangles:
          minItems: 1
          maxItems: 1024
          type: array
          items:
            type: object
            properties:
              x:
                type: number
              y:
                type: number
              width:
                type: number
                minimum: 0
              height:
                type: number
                minimum: 0
            required:
              - x
              - y
              - width
              - height
            additionalProperties: false
      required:
        - type
        - pageIndex
        - rectangles
      additionalProperties: false
      title: RectangleSelector
      description: 'Recueil extension: page-anchored rectangles in PDF user-space units. Resolvable
        without the text layer, which is what invariant AN4 requires of every annotation.'
    InkSelector:
      type: object
      properties:
        type:
          type: string
          const: InkSelector
        pageIndex:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        paths:
          minItems: 1
          maxItems: 256
          type: array
          items:
            minItems: 2
            maxItems: 4096
            type: array
            items:
              type: object
              properties:
                x:
                  type: number
                y:
                  type: number
              required:
                - x
                - y
              additionalProperties: false
        strokeWidth:
          type: number
          minimum: 0
      required:
        - type
        - pageIndex
        - paths
      additionalProperties: false
      title: InkSelector
      description: 'Recueil extension: freehand ink as page-anchored polylines.'
    AnnotationSelector:
      oneOf:
        - $ref: '#/components/schemas/TextQuoteSelector'
        - $ref: '#/components/schemas/TextPositionSelector'
        - $ref: '#/components/schemas/FragmentSelector'
        - $ref: '#/components/schemas/RectangleSelector'
        - $ref: '#/components/schemas/InkSelector'
      title: AnnotationSelector
      description: One selector. An annotation carries the whole set that located it.
      type: object
      discriminator:
        propertyName: type
        mapping:
          TextQuoteSelector: '#/components/schemas/TextQuoteSelector'
          TextPositionSelector: '#/components/schemas/TextPositionSelector'
          FragmentSelector: '#/components/schemas/FragmentSelector'
          RectangleSelector: '#/components/schemas/RectangleSelector'
          InkSelector: '#/components/schemas/InkSelector'
    AnnotationSelectorSet:
      minItems: 1
      maxItems: 16
      type: array
      items:
        $ref: '#/components/schemas/AnnotationSelector'
      title: AnnotationSelectorSet
      description: The selectors that locate one annotation. At least one must not depend on the text
        layer (AN4).
    Annotation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        publicId:
          $ref: '#/components/schemas/PublicId'
        quotedText:
          description: TextQuoteSelector.exact, lifted out of the selector so it can be full-text indexed.
          anyOf:
            - type: string
              maxLength: 1000000
            - type: 'null'
        prefixText:
          anyOf:
            - type: string
              maxLength: 4096
            - type: 'null'
        suffixText:
          anyOf:
            - type: string
              maxLength: 4096
            - type: 'null'
        positionSortKey:
          type: string
          maxLength: 64
          description: Fixed-width reading-order key (page, y, x) — the portable equivalent of Zotero sortIndex.
        authorUserId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        isExternal:
          type: boolean
          description: True when extracted from annotations already embedded in the PDF at ingest.
        externalRef:
          description: The embedded annotation's identity, so re-extraction does not duplicate (P9).
          anyOf:
            - type: string
              maxLength: 255
            - type: 'null'
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        trashedAt:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        documentId:
          description: The W3C target source. The annotation belongs to the bytes (ADR-0009).
          $ref: '#/components/schemas/Id'
        itemId:
          description: Reading context. A live attachment must exist for (itemId, documentId) (AN2).
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        attachmentId:
          description: The route by which the document was read.
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        annotationType:
          $ref: '#/components/schemas/AnnotationType'
        motivation:
          $ref: '#/components/schemas/AnnotationMotivation'
        selector:
          $ref: '#/components/schemas/AnnotationSelectorSet'
        bodyText:
          description: The comment attached to the annotation.
          anyOf:
            - type: string
              maxLength: 1000000
            - type: 'null'
        bodyFormat:
          $ref: '#/components/schemas/AnnotationBodyFormat'
        colour:
          anyOf:
            - $ref: '#/components/schemas/HexColour'
            - type: 'null'
        pageIndex:
          description: Zero-based physical page.
          anyOf:
            - type: integer
              minimum: 0
              maximum: 9007199254740991
            - type: 'null'
        pageLabel:
          description: The printed page label, which is frequently not the physical index.
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        authorName:
          description: For annotations imported from someone else.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
      required:
        - id
        - publicId
        - positionSortKey
        - isExternal
        - version
        - createdAt
        - updatedAt
        - documentId
        - annotationType
        - motivation
        - selector
        - bodyFormat
      additionalProperties: false
      title: Annotation
      description: A reading annotation as a record. The document bytes are never modified to store one;
        export to embedded PDF annotations produces a new document with its own hash (AN1).
    TextualBody:
      type: object
      properties:
        type:
          type: string
          const: TextualBody
        value:
          type: string
          maxLength: 1000000
        format:
          examples:
            - text/markdown
          type: string
          maxLength: 64
        language:
          type: string
          maxLength: 32
        purpose:
          $ref: '#/components/schemas/AnnotationMotivation'
      required:
        - type
        - value
      additionalProperties: false
      title: TextualBody
    Creator:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        displayName:
