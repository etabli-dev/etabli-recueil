    get:
      operationId: listItems
      summary: List items
      description: >-
        A page of library rows, newest first. Every filter combines with `AND`; `q` is a full-text
        filter in Recueil's query syntax, folded into the SQL query rather than ranked — for ranking
        use `GET /api/v1/search`.


        **Scope:** `items:read`.
