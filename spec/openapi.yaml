          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        givenName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        namePrefix:
          description: '`van`, `de`, where the source separates it.'
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
        nameSuffix:
          description: '`Jr`, `III`.'
          anyOf:
            - type: string
              maxLength: 64
            - type: 'null'
        literalName:
          description: Single-field name. Required for an organisation and for persons whose name does not
            split.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        initials:
          description: bibliometrix AU uses the abbreviated form.
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        nameVariants:
          maxItems: 256
          type: array
          items:
            $ref: '#/components/schemas/NameVariant'
        orcid:
          anyOf:
            - $ref: '#/components/schemas/Orcid'
            - type: 'null'
        openalexAuthorId:
          anyOf:
            - type: string
              pattern: ^A\d{2,12}$
            - type: 'null'
        semanticScholarAuthorId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        scopusAuthorId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        researcherId:
          anyOf:
            - type: string
              maxLength: 32
            - type: 'null'
        isni:
          anyOf:
            - type: string
              pattern: ^\d{15}[\dX]$
            - type: 'null'
        viaf:
          anyOf:
            - type: string
              pattern: ^\d{1,22}$
            - type: 'null'
        ror:
          description: Organisations only.
          anyOf:
            - $ref: '#/components/schemas/Ror'
            - type: 'null'
        wikidataId:
          anyOf:
            - type: string
              pattern: ^Q\d+$
            - type: 'null'
