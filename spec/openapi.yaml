        - creatorId
        - role
      additionalProperties: false
      title: ItemCreator
      description: A creator's appearance on one item, with role, order and the affiliation as printed.
    ItemCreatorInput:
      type: object
      properties:
        creatorId:
          description: Omit to have the server resolve or create the creator from `creator`.
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/CreatorRole'
        rawName:
          description: Exactly as printed, kept for BibTeX fidelity and the `author_consistency` check.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        affiliationRaw:
          description: The affiliation as printed — bibliometrix C1.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 1024
            - type: 'null'
        affiliationRor:
          anyOf:
            - $ref: '#/components/schemas/Ror'
            - type: 'null'
        affiliationCreatorId:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        countryCode:
          anyOf:
            - $ref: '#/components/schemas/CountryCode'
            - type: 'null'
        isCorresponding:
          type: boolean
        contributionRoles:
          description: CRediT taxonomy roles, when the source supplies them.
          anyOf:
            - maxItems: 32
              type: array
              items:
                type: string
                maxLength: 64
            - type: 'null'
        creator:
          description: An inline creator to resolve against existing records and create if new.
          $ref: '#/components/schemas/CreatorCreate'
      required:
        - role
      additionalProperties: false
      title: ItemCreatorInput
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$
      title: Cursor
      description: Opaque continuation token. Pass it back verbatim; never construct or parse one.
    SortDirection:
      type: string
      enum:
        - asc
        - desc
    PageInfo:
      type: object
      properties:
        nextCursor:
          anyOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
          description: Null on the last page. Its absence is the end condition.
        hasMore:
          type: boolean
        limit:
          type: integer
          minimum: 1
          maximum: 200
        total:
          description: 'Total matching records, when the endpoint can count them cheaply. Absent is not zero:
            an endpoint that cannot count without a table scan omits it rather than lying.'
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - nextCursor
        - hasMore
        - limit
      additionalProperties: false
      title: PageInfo
    ProblemError:
      type: object
      properties:
        path:
          type: string
          maxLength: 512
          description: Dotted path to the offending value, e.g. `bibliographic.doi` or `creators.0.role`.
        message:
          type: string
          maxLength: 1024
        code:
          description: The validator code, e.g. `invalid_format`, so a client can branch without parsing prose.
          type: string
          maxLength: 64
      required:
        - path
        - message
      additionalProperties: false
      title: ProblemError
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          maxLength: 512
          description: A stable URI identifying the problem type. Clients switch on this and nothing else.
          examples:
            - https://recueil.org/problems/validation
        title:
          type: string
          maxLength: 255
          description: 'A short, human-readable summary. Prose: it may be reworded.'
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          description: An explanation of this occurrence, naming the field where there is one.
          type: string
          maxLength: 4096
        instance:
          description: The request path this occurrence relates to.
          type: string
          maxLength: 1024
        errors:
          description: Field-level detail for a validation failure. RFC 9457 extension member.
          maxItems: 1000
          type: array
          items:
            $ref: '#/components/schemas/ProblemError'
        traceId:
          description: Correlates the response with the server log line. RFC 9457 extension member.
          type: string
          maxLength: 128
        jobId:
          description: The job this problem came from, where one exists.
          $ref: '#/components/schemas/Id'
        retryAfterSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - type
        - title
        - status
      additionalProperties: false
      title: ProblemDetails
      description: An RFC 9457 problem document, served as `application/problem+json`. Every error
        response in the API has this shape.
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 255
      pattern: ^[A-Za-z0-9._:-]+$
      title: IdempotencyKey
      description: Client-supplied key for a bulk write. Replaying a key returns the original result —
        including the original job — rather than enqueuing a second one (IK2).
      examples:
        - 01J8F3Z9K4ABCDEFGHJKMNPQRS
    BulkOperationOutcome:
      type: object
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Position in the submitted array.
        ref:
          type: string
          maxLength: 64
        status:
          type: string
          enum:
            - created
            - updated
            - deleted
            - restored
            - unchanged
            - failed
        id:
          $ref: '#/components/schemas/Id'
        problem:
          description: Present when, and only when, `status` is `failed`.
          $ref: '#/components/schemas/ProblemDetails'
      required:
        - index
        - status
      additionalProperties: false
      title: BulkOperationOutcome
    HealthStatus:
      type: string
      enum:
        - ok
        - degraded
        - error
      title: HealthStatus
      description: '`ok` — everything required is working. `degraded` — an optional component (a sidecar,
        a resolver) is down but the library is serving. `error` — the library is not serving.'
    ComponentHealth:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
          description: Stable component name.
          examples:
            - database
            - storage
            - jobs
            - search
        status:
          $ref: '#/components/schemas/HealthStatus'
        required:
          type: boolean
          description: Whether a failure here makes the whole response `error` rather than `degraded`.
        detail:
          type: string
          maxLength: 1024
        latencyMs:
          type: number
          minimum: 0
        checkedAt:
          description: When this component was last probed.
          $ref: '#/components/schemas/Timestamp'
      required:
        - name
        - status
        - required
      additionalProperties: false
      title: ComponentHealth
    LibrarySummary:
      type: object
      properties:
        items:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        documents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        attachments:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        collections:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        countedAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - items
        - documents
        - attachments
        - collections
      additionalProperties: false
      title: LibrarySummary
      description: Live record counts. Zero across the board is a healthy empty library, not a fault.
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        name:
          type: string
          const: recueil
        version:
          type: string
          maxLength: 64
          description: The server version.
          examples:
            - 0.1.0
        apiVersion:
          type: string
          maxLength: 16
          description: The REST API major version this server serves.
          examples:
            - v1
        checkedAt:
          $ref: '#/components/schemas/Timestamp'
        startedAt:
          $ref: '#/components/schemas/Timestamp'
        uptimeSeconds:
          type: number
          minimum: 0
        mode:
          type: string
          enum:
            - server
            - sidecar
          description: Docker and local mode run identical code; the shell differs (CONCEPT.md §5.1).
        components:
          maxItems: 64
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
        library:
          $ref: '#/components/schemas/LibrarySummary'
      required:
        - status
        - name
        - version
        - apiVersion
        - checkedAt
        - startedAt
        - uptimeSeconds
        - mode
        - components
      additionalProperties: false
      title: HealthResponse
      description: 'The response of `GET /health`. Unauthenticated, cheap, and safe to poll: measurements
        that cost anything are cached and reported with the time they were taken.'
