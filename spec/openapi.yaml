          minLength: 1
          maxLength: 1024
        source:
          type: string
          maxLength: 96
        count:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - form
        - source
      additionalProperties: false
      title: NameVariant
    ItemCreator:
      type: object
      properties:
        ordinal:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: Zero-based position in the author list; dense within an item (IC1).
        creator:
          description: The expanded creator record, when the caller asked for it.
