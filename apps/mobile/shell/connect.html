<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: http://localhost:* http://127.0.0.1:* http://10.0.2.2:*; style-src 'self'; img-src 'self' data:" />
    <title>Connect to Recueil</title>
    <link rel="stylesheet" href="./connect.css" />
  </head>
  <body>
    <main>
      <h1>Recueil</h1>
      <p>This app is a window onto your own Recueil server. Give its address and, if it asks for one, a token with the <code>ingestion:write</code> and <code>items:write</code> scopes.</p>
      <form id="connect">
        <label>Server address <input id="url" type="url" inputmode="url" autocomplete="url" placeholder="https://recueil.example.org" required /></label>
        <label>Token <input id="token" type="password" autocomplete="off" placeholder="rc_…" /></label>
        <button type="submit">Connect</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./connect.ts"></script>
  </body>
</html>
